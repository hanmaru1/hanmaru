<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성경 - 평창교회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f1923;--bg2:#1a2535;--bg3:#243045;
    --gold:#c9a96e;--gold2:#e8c98a;
    --text:#e8e0d0;--text2:#a09880;
    --border:rgba(201,169,110,.2);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;}
  header{
    background:linear-gradient(135deg,#0a1520,#1a2535);
    border-bottom:1px solid var(--border);
    padding:10px 14px;
    display:flex;align-items:center;gap:10px;
    flex-shrink:0;
  }
  .logo{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:700;color:var(--gold);white-space:nowrap;}
  .controls{display:flex;gap:6px;flex-wrap:wrap;flex:1;}
  select{
    padding:7px 10px;background:var(--bg3);border:1px solid var(--border);
    border-radius:8px;color:var(--text);font-size:12px;font-family:inherit;
    outline:none;cursor:pointer;
  }
  .go-btn{
    padding:7px 14px;background:var(--gold);color:var(--bg);
    border:none;border-radius:8px;font-size:12px;font-weight:700;
    font-family:inherit;cursor:pointer;white-space:nowrap;
  }
  .go-btn:hover{background:var(--gold2);}
  .back-btn{
    padding:7px 12px;background:rgba(201,169,110,.15);
    border:1px solid var(--border);border-radius:8px;
    color:var(--gold);font-size:12px;font-family:inherit;
    cursor:pointer;text-decoration:none;white-space:nowrap;
  }
  #bibleFrame{
    flex:1;width:100%;border:none;
    background:#fff;
  }
  .ver-badge{
    font-size:10px;padding:2px 8px;background:rgba(201,169,110,.15);
    border:1px solid var(--border);border-radius:99px;color:var(--gold2);
    white-space:nowrap;
  }
</style>
</head>
<body>
<header>
  <div class="logo">✝ 성경</div>
  <div class="controls">
    <select id="bookSel" onchange="updateChapters()"></select>
    <select id="chapSel"></select>
    <button class="go-btn" onclick="loadVerse()">📖 열기</button>
    <span class="ver-badge">개역한글</span>
  </div>
  <a href="index.html" class="back-btn">← 앱</a>
</header>
<iframe id="bibleFrame" src="about:blank"></iframe>

<script>
const OT = [
  {n:"창세기",c:50},{n:"출애굽기",c:40},{n:"레위기",c:27},{n:"민수기",c:36},
  {n:"신명기",c:34},{n:"여호수아",c:24},{n:"사사기",c:21},{n:"룻기",c:4},
  {n:"사무엘상",c:31},{n:"사무엘하",c:24},{n:"열왕기상",c:22},{n:"열왕기하",c:25},
  {n:"역대상",c:29},{n:"역대하",c:36},{n:"에스라",c:10},{n:"느헤미야",c:13},
  {n:"에스더",c:10},{n:"욥기",c:42},{n:"시편",c:150},{n:"잠언",c:31},
  {n:"전도서",c:12},{n:"아가",c:8},{n:"이사야",c:66},{n:"예레미야",c:52},
  {n:"예레미야애가",c:5},{n:"에스겔",c:48},{n:"다니엘",c:12},{n:"호세아",c:14},
  {n:"요엘",c:3},{n:"아모스",c:9},{n:"오바댜",c:1},{n:"요나",c:4},
  {n:"미가",c:7},{n:"나훔",c:3},{n:"하박국",c:3},{n:"스바냐",c:3},
  {n:"학개",c:2},{n:"스가랴",c:14},{n:"말라기",c:4}
];
const NT = [
  {n:"마태복음",c:28},{n:"마가복음",c:16},{n:"누가복음",c:24},{n:"요한복음",c:21},
  {n:"사도행전",c:28},{n:"로마서",c:16},{n:"고린도전서",c:16},{n:"고린도후서",c:13},
  {n:"갈라디아서",c:6},{n:"에베소서",c:6},{n:"빌립보서",c:4},{n:"골로새서",c:4},
  {n:"데살로니가전서",c:5},{n:"데살로니가후서",c:3},{n:"디모데전서",c:6},{n:"디모데후서",c:4},
  {n:"디도서",c:3},{n:"빌레몬서",c:1},{n:"히브리서",c:13},{n:"야고보서",c:5},
  {n:"베드로전서",c:5},{n:"베드로후서",c:3},{n:"요한일서",c:5},{n:"요한이서",c:1},
  {n:"요한삼서",c:1},{n:"유다서",c:1},{n:"요한계시록",c:22}
];
const ALL = [...OT,...NT];

// 책 선택 초기화
function init(){
  const sel = document.getElementById('bookSel');
  sel.innerHTML =
    '<optgroup label="구약성경">' + OT.map((b,i)=>`<option value="${i}">${b.n}</option>`).join('') + '</optgroup>' +
    '<optgroup label="신약성경">' + NT.map((b,i)=>`<option value="${i+39}">${b.n}</option>`).join('') + '</optgroup>';
  updateChapters();
  // 기본: 요한복음 3장
  sel.value = '42';
  updateChapters();
  document.getElementById('chapSel').value = '3';
  loadVerse();
}

function updateChapters(){
  const idx = parseInt(document.getElementById('bookSel').value);
  const book = ALL[idx];
  const cs = document.getElementById('chapSel');
  cs.innerHTML = Array.from({length:book.c},(_,i)=>`<option value="${i+1}">${i+1}장</option>`).join('');
}

function loadVerse(){
  const idx = parseInt(document.getElementById('bookSel').value)+1; // 1-based
  const chap = document.getElementById('chapSel').value;
  // 홀리바이블 개역한글 URL
  const url = `https://holybible.or.kr/B_RHV/cboard.php?book=${idx}&jang=${chap}&version=kor`;
  document.getElementById('bibleFrame').src = url;
}

init();
</script>
</body>
</html>
