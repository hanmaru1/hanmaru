<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성경 - 평창교회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1923;
    --bg2: #1a2535;
    --bg3: #243045;
    --gold: #c9a96e;
    --gold2: #e8c98a;
    --text: #e8e0d0;
    --text2: #a09880;
    --accent: #4a90d9;
    --border: rgba(201,169,110,.2);
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* 헤더 */
  header {
    background: linear-gradient(135deg, #0a1520, #1a2535);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-family: 'Noto Serif KR', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .logo span { font-size: 22px; }

  /* 검색바 */
  .search-wrap {
    flex: 1;
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    padding: 9px 40px 9px 14px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 99px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color .2s;
  }
  .search-wrap input:focus { border-color: var(--gold); }
  .search-wrap input::placeholder { color: var(--text2); }
  .search-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--gold);
    cursor: pointer;
    font-size: 16px;
  }
  .back-btn {
    background: rgba(201,169,110,.15);
    border: 1px solid var(--border);
    color: var(--gold);
    padding: 8px 14px;
    border-radius: 99px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* 메인 레이아웃 */
  .container { display: flex; flex: 1; overflow: hidden; }

  /* 사이드바 */
  .sidebar {
    width: 200px;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
  }
  .sidebar-section {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-title {
    font-size: 10px;
    font-weight: 700;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: .1em;
    padding: 6px 14px;
  }
  .book-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 6px 14px;
    background: none;
    border: none;
    color: var(--text2);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: all .15s;
  }
  .book-btn:hover, .book-btn.active {
    background: rgba(201,169,110,.12);
    color: var(--gold2);
    padding-left: 18px;
  }

  /* 컨텐츠 영역 */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    max-width: 800px;
    margin: 0 auto;
    width: 100%;
  }

  /* 장 선택 */
  .chapter-select-wrap {
    margin-bottom: 20px;
  }
  .chapter-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chapter-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text2);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: all .15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .chapter-btn:hover, .chapter-btn.active {
    background: var(--gold);
    color: var(--bg);
    border-color: var(--gold);
    font-weight: 700;
  }

  /* 책 제목 */
  .book-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 4px;
  }
  .book-subtitle {
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .divider {
    height: 1px;
    background: var(--border);
    margin: 16px 0;
  }

  /* 성경 구절 */
  .verse-list { }
  .verse-item {
    display: flex;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(201,169,110,.08);
    cursor: pointer;
    transition: background .15s;
    border-radius: 6px;
    padding: 8px 10px;
  }
  .verse-item:hover { background: rgba(201,169,110,.07); }
  .verse-item.selected { background: rgba(201,169,110,.12); }
  .verse-num {
    font-size: 11px;
    font-weight: 700;
    color: var(--gold);
    min-width: 22px;
    padding-top: 3px;
    font-family: monospace;
  }
  .verse-text {
    font-family: 'Noto Serif KR', serif;
    font-size: 16px;
    line-height: 1.8;
    color: var(--text);
    flex: 1;
  }

  /* 로딩 */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px;
    flex-direction: column;
    gap: 16px;
    color: var(--text2);
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 말씀카드 버튼 */
  .card-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: linear-gradient(135deg, var(--gold), var(--gold2));
    color: var(--bg);
    border: none;
    border-radius: 99px;
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(201,169,110,.4);
    display: none;
    align-items: center;
    gap: 6px;
    transition: transform .2s;
  }
  .card-btn:hover { transform: scale(1.05); }
  .card-btn.show { display: flex; }

  /* 선택된 구절 팝업 */
  .selected-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: none;
    align-items: center;
    gap: 10px;
    z-index: 200;
  }
  .selected-bar.show { display: flex; }
  .selected-text {
    flex: 1;
    font-size: 12px;
    color: var(--text2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .selected-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .sel-btn {
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    border: none;
  }
  .sel-btn-card { background: var(--gold); color: var(--bg); }
  .sel-btn-copy { background: var(--bg3); color: var(--text); }
  .sel-btn-close { background: transparent; color: var(--text2); font-size: 16px; }

  /* 메인 화면 */
  .home-wrap {
    padding: 30px 20px;
    text-align: center;
  }
  .home-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 8px;
  }
  .home-sub { font-size: 13px; color: var(--text2); margin-bottom: 30px; }
  .testament-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: .1em;
    text-align: left;
    margin-bottom: 10px;
    margin-top: 20px;
  }
  .books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 8px;
    text-align: left;
  }
  .home-book-btn {
    padding: 10px 8px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text2);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: all .15s;
    text-align: center;
  }
  .home-book-btn:hover {
    background: rgba(201,169,110,.15);
    color: var(--gold2);
    border-color: var(--gold);
  }

  /* 모바일 */
  @media (max-width: 640px) {
    .sidebar { display: none; }
    .verse-text { font-size: 15px; }
    .content { padding: 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span>✝</span> 성경</div>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="구절 검색... (예: 요3:16, 시편 23장)" onkeydown="if(event.key==='Enter')doSearch()">
    <button class="search-btn" onclick="doSearch()">🔍</button>
  </div>
  <a href="index.html" class="back-btn">← 앱으로</a>
</header>

<div class="container">
  <!-- 사이드바 -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">구약</div>
      <div id="otBooks"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">신약</div>
      <div id="ntBooks"></div>
    </div>
  </div>

  <!-- 컨텐츠 -->
  <div class="content" id="content">
    <div class="home-wrap" id="homeView"></div>
  </div>
</div>

<!-- 선택된 구절 바 -->
<div class="selected-bar" id="selectedBar">
  <div class="selected-text" id="selectedText"></div>
  <div class="selected-actions">
    <button class="sel-btn sel-btn-card" onclick="sendToCard()">✨ 말씀카드</button>
    <button class="sel-btn sel-btn-copy" onclick="copyVerse()">📋 복사</button>
    <button class="sel-btn sel-btn-close" onclick="clearSelected()">✕</button>
  </div>
</div>

<script>
// ══ 성경 책 데이터 ══════════════════════════════════
const OT_BOOKS = [
  {name:"창세기",abbr:"창",chapters:50},{name:"출애굽기",abbr:"출",chapters:40},
  {name:"레위기",abbr:"레",chapters:27},{name:"민수기",abbr:"민",chapters:36},
  {name:"신명기",abbr:"신",chapters:34},{name:"여호수아",abbr:"수",chapters:24},
  {name:"사사기",abbr:"삿",chapters:21},{name:"룻기",abbr:"룻",chapters:4},
  {name:"사무엘상",abbr:"삼상",chapters:31},{name:"사무엘하",abbr:"삼하",chapters:24},
  {name:"열왕기상",abbr:"왕상",chapters:22},{name:"열왕기하",abbr:"왕하",chapters:25},
  {name:"역대상",abbr:"대상",chapters:29},{name:"역대하",abbr:"대하",chapters:36},
  {name:"에스라",abbr:"스",chapters:10},{name:"느헤미야",abbr:"느",chapters:13},
  {name:"에스더",abbr:"에",chapters:10},{name:"욥기",abbr:"욥",chapters:42},
  {name:"시편",abbr:"시",chapters:150},{name:"잠언",abbr:"잠",chapters:31},
  {name:"전도서",abbr:"전",chapters:12},{name:"아가",abbr:"아",chapters:8},
  {name:"이사야",abbr:"사",chapters:66},{name:"예레미야",abbr:"렘",chapters:52},
  {name:"예레미야애가",abbr:"애",chapters:5},{name:"에스겔",abbr:"겔",chapters:48},
  {name:"다니엘",abbr:"단",chapters:12},{name:"호세아",abbr:"호",chapters:14},
  {name:"요엘",abbr:"욜",chapters:3},{name:"아모스",abbr:"암",chapters:9},
  {name:"오바댜",abbr:"옵",chapters:1},{name:"요나",abbr:"욘",chapters:4},
  {name:"미가",abbr:"미",chapters:7},{name:"나훔",abbr:"나",chapters:3},
  {name:"하박국",abbr:"합",chapters:3},{name:"스바냐",abbr:"습",chapters:3},
  {name:"학개",abbr:"학",chapters:2},{name:"스가랴",abbr:"슥",chapters:14},
  {name:"말라기",abbr:"말",chapters:4}
];
const NT_BOOKS = [
  {name:"마태복음",abbr:"마",chapters:28},{name:"마가복음",abbr:"막",chapters:16},
  {name:"누가복음",abbr:"눅",chapters:24},{name:"요한복음",abbr:"요",chapters:21},
  {name:"사도행전",abbr:"행",chapters:28},{name:"로마서",abbr:"롬",chapters:16},
  {name:"고린도전서",abbr:"고전",chapters:16},{name:"고린도후서",abbr:"고후",chapters:13},
  {name:"갈라디아서",abbr:"갈",chapters:6},{name:"에베소서",abbr:"엡",chapters:6},
  {name:"빌립보서",abbr:"빌",chapters:4},{name:"골로새서",abbr:"골",chapters:4},
  {name:"데살로니가전서",abbr:"살전",chapters:5},{name:"데살로니가후서",abbr:"살후",chapters:3},
  {name:"디모데전서",abbr:"딤전",chapters:6},{name:"디모데후서",abbr:"딤후",chapters:4},
  {name:"디도서",abbr:"딛",chapters:3},{name:"빌레몬서",abbr:"몬",chapters:1},
  {name:"히브리서",abbr:"히",chapters:13},{name:"야고보서",abbr:"약",chapters:5},
  {name:"베드로전서",abbr:"벧전",chapters:5},{name:"베드로후서",abbr:"벧후",chapters:3},
  {name:"요한일서",abbr:"요일",chapters:5},{name:"요한이서",abbr:"요이",chapters:1},
  {name:"요한삼서",abbr:"요삼",chapters:1},{name:"유다서",abbr:"유",chapters:1},
  {name:"요한계시록",abbr:"계",chapters:22}
];
const ALL_BOOKS = [...OT_BOOKS, ...NT_BOOKS];

// 현재 상태
let curBook = null, curChapter = 1, selectedVerse = null, selectedRef = '';

// ══ 초기화 ══════════════════════════════════════════
function init(){
  // 사이드바 생성
  document.getElementById('otBooks').innerHTML = OT_BOOKS.map(b=>
    `<button class="book-btn" onclick="selectBook('${b.name}')">${b.name}</button>`
  ).join('');
  document.getElementById('ntBooks').innerHTML = NT_BOOKS.map(b=>
    `<button class="book-btn" onclick="selectBook('${b.name}')">${b.name}</button>`
  ).join('');
  renderHome();
}

// ══ 홈 화면 ══════════════════════════════════════════
function renderHome(){
  const el = document.getElementById('homeView');
  el.innerHTML = `
    <div class="home-title">✝ 개역한글 성경</div>
    <div class="home-sub">평창교회 · 책을 선택하세요</div>
    <div class="testament-title">구약성경 (39권)</div>
    <div class="books-grid">${OT_BOOKS.map(b=>`<button class="home-book-btn" onclick="selectBook('${b.name}')">${b.name}</button>`).join('')}</div>
    <div class="testament-title">신약성경 (27권)</div>
    <div class="books-grid">${NT_BOOKS.map(b=>`<button class="home-book-btn" onclick="selectBook('${b.name}')">${b.name}</button>`).join('')}</div>
  `;
  document.getElementById('homeView').style.display = 'block';
}

// ══ 책 선택 ══════════════════════════════════════════
function selectBook(bookName){
  curBook = ALL_BOOKS.find(b=>b.name===bookName);
  if(!curBook) return;
  curChapter = 1;
  // 사이드바 활성화
  document.querySelectorAll('.book-btn').forEach(b=>{
    b.classList.toggle('active', b.textContent===bookName);
  });
  renderChapterSelect();
}

function renderChapterSelect(){
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="book-title">${curBook.name}</div>
    <div class="book-subtitle">
      <span>개역한글</span>
      <span>·</span>
      <span>총 ${curBook.chapters}장</span>
    </div>
    <div class="divider"></div>
    <div class="chapter-select-wrap">
      <div style="font-size:12px;color:var(--text2);margin-bottom:10px;font-weight:700;">장을 선택하세요</div>
      <div class="chapter-grid">
        ${Array.from({length:curBook.chapters},(_,i)=>
          `<button class="chapter-btn" onclick="loadChapter(${i+1})">${i+1}</button>`
        ).join('')}
      </div>
    </div>
  `;
}

// ══ 성경 구절 불러오기 ══════════════════════════════
async function loadChapter(chapter){
  curChapter = chapter;
  const content = document.getElementById('content');
  content.innerHTML = `<div class="loading"><div class="spinner"></div><div>불러오는 중...</div></div>`;

  try {
    const verses = await fetchVerses(curBook.name, chapter);
    renderVerses(verses, chapter);
  } catch(e) {
    content.innerHTML = `
      <div style="padding:30px;text-align:center;">
        <div style="font-size:40px;margin-bottom:12px;">⚠️</div>
        <div style="color:var(--text2);font-size:14px;">말씀을 불러오지 못했습니다</div>
        <div style="color:var(--text2);font-size:12px;margin-top:6px;">${e.message}</div>
        <button onclick="loadChapter(${chapter})" style="margin-top:16px;padding:8px 20px;background:var(--gold);color:var(--bg);border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:700;">다시 시도</button>
      </div>`;
  }
}

// holybible.or.kr API 호출
async function fetchVerses(bookName, chapter){
  // 책 번호 계산
  const bookIdx = ALL_BOOKS.findIndex(b=>b.name===bookName) + 1;
  const url = `https://holybible.or.kr/B_GAE/pgetverse.php?bBook=${bookIdx}&bJang=${chapter}&version=kor`;

  const resp = await fetch(url);
  if(!resp.ok) throw new Error('서버 응답 오류');
  const text = await resp.text();

  // HTML 파싱
  const parser = new DOMParser();
  const doc = parser.parseFromString(text, 'text/html');
  const verses = [];
  doc.querySelectorAll('font[color]').forEach((el, i)=>{
    const txt = el.textContent.trim();
    if(txt && !txt.match(/^\d+$/)) {
      verses.push({num: i+1, text: txt});
    }
  });

  if(!verses.length) throw new Error('구절을 찾을 수 없습니다');
  return verses;
}

function renderVerses(verses, chapter){
  const content = document.getElementById('content');
  content.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">
      <button onclick="renderChapterSelect()" style="background:none;border:none;color:var(--gold);cursor:pointer;font-size:20px;">←</button>
      <div class="book-title">${curBook.name} ${chapter}장</div>
    </div>
    <div class="book-subtitle">
      <span>개역한글</span>
      <span>·</span>
      <span>${verses.length}절</span>
      <span>·</span>
      <div style="display:flex;gap:4px;">
        ${chapter > 1 ? `<button onclick="loadChapter(${chapter-1})" style="padding:2px 8px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:4px;cursor:pointer;font-size:11px;font-family:inherit;">◀ ${chapter-1}장</button>` : ''}
        ${chapter < curBook.chapters ? `<button onclick="loadChapter(${chapter+1})" style="padding:2px 8px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:4px;cursor:pointer;font-size:11px;font-family:inherit;">${chapter+1}장 ▶</button>` : ''}
      </div>
    </div>
    <div class="divider"></div>
    <div class="verse-list">
      ${verses.map(v=>`
        <div class="verse-item" onclick="selectVerse(${v.num},'${escapeStr(v.text)}')" id="verse-${v.num}">
          <div class="verse-num">${v.num}</div>
          <div class="verse-text">${v.text}</div>
        </div>
      `).join('')}
    </div>
    <div style="height:80px;"></div>
  `;
}

function escapeStr(s){ return s.replace(/'/g,"\\'"); }

// ══ 구절 선택 ══════════════════════════════════════
function selectVerse(num, text){
  // 기존 선택 해제
  document.querySelectorAll('.verse-item').forEach(v=>v.classList.remove('selected'));
  document.getElementById('verse-'+num)?.classList.add('selected');

  selectedRef = `${curBook.abbr} ${curChapter}:${num}`;
  selectedVerse = text;

  const bar = document.getElementById('selectedBar');
  document.getElementById('selectedText').textContent = `${selectedRef} "${text.substring(0,40)}..."`;
  bar.classList.add('show');
}

function clearSelected(){
  selectedVerse = null;
  document.querySelectorAll('.verse-item').forEach(v=>v.classList.remove('selected'));
  document.getElementById('selectedBar').classList.remove('show');
}

function copyVerse(){
  if(!selectedVerse) return;
  const full = `"${selectedVerse}" - ${selectedRef} (개역한글)`;
  navigator.clipboard.writeText(full).then(()=>{
    showToast('📋 복사되었습니다!');
  });
}

function sendToCard(){
  if(!selectedVerse) return;
  // 메인 앱 말씀카드로 전달
  const params = new URLSearchParams({
    ref: selectedRef,
    text: selectedVerse,
    from: 'bible'
  });
  window.location.href = 'index.html#versecard?' + params.toString();
}

// ══ 검색 ══════════════════════════════════════════
function doSearch(){
  const q = document.getElementById('searchInput').value.trim();
  if(!q) return;

  // "시편 23장" 또는 "시23:1" 형식 파싱
  let bookName = null, chapter = null, verse = null;

  // "책이름 숫자장" 형식
  const m1 = q.match(/^(.+?)\s*(\d+)\s*장?(:(\d+))?$/);
  if(m1){
    const b = ALL_BOOKS.find(b=>b.name.includes(m1[1])||b.abbr===m1[1]);
    if(b){ bookName=b.name; chapter=parseInt(m1[2]); verse=m1[4]?parseInt(m1[4]):null; }
  }

  // "약어숫자:숫자" 형식
  const m2 = q.match(/^([가-힣]+)(\d+):(\d+)$/);
  if(!bookName && m2){
    const b = ALL_BOOKS.find(b=>b.abbr===m2[1]||b.name.startsWith(m2[1]));
    if(b){ bookName=b.name; chapter=parseInt(m2[2]); verse=parseInt(m2[3]); }
  }

  if(bookName && chapter){
    selectBook(bookName);
    loadChapter(chapter);
    if(verse){
      setTimeout(()=>{
        const el = document.getElementById('verse-'+verse);
        if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.click(); }
      }, 1500);
    }
  } else {
    showToast('예) 시편 23장, 요3:16, 시23:1');
  }
}

// ══ 토스트 ══════════════════════════════════════════
function showToast(msg){
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#1a2535;color:#e8c98a;border:1px solid rgba(201,169,110,.3);padding:10px 20px;border-radius:99px;font-size:13px;z-index:9999;font-family:inherit;';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2500);
}

init();
