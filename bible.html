<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성경 - 평창교회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1923;--bg2:#1a2535;--bg3:#243045;--gold:#c9a96e;--gold2:#e8c98a;--text:#e8e0d0;--text2:#a09880;--border:rgba(201,169,110,.2);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:linear-gradient(135deg,#0a1520,#1a2535);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;gap:12px;}
.logo{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:8px;}
.back-btn{margin-left:auto;padding:8px 14px;background:rgba(201,169,110,.15);border:1px solid var(--border);border-radius:8px;color:var(--gold);font-size:12px;font-family:inherit;cursor:pointer;text-decoration:none;white-space:nowrap;}
.main{max-width:600px;margin:0 auto;padding:30px 18px;}

/* 메인 링크 버튼 */
.bible-link{
  display:flex;align-items:center;gap:16px;
  padding:22px 24px;
  background:linear-gradient(135deg,#1a2535,#243045);
  border:1.5px solid var(--gold);
  border-radius:16px;
  text-decoration:none;
  margin-bottom:16px;
  transition:all .2s;
}
.bible-link:hover{background:linear-gradient(135deg,#243045,#2d3d5a);transform:translateY(-2px);box-shadow:0 8px 24px rgba(201,169,110,.2);}
.bible-link .icon{font-size:32px;flex-shrink:0;}
.bible-link .info{}
.bible-link .info b{display:block;font-size:16px;font-weight:700;color:var(--gold2);margin-bottom:4px;}
.bible-link .info span{font-size:12px;color:var(--text2);line-height:1.5;}
.bible-link .arrow{margin-left:auto;font-size:20px;color:var(--gold);flex-shrink:0;}

.section-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;margin:24px 0 12px;}

/* 자주 찾는 구절 */
.verse-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px;}
.verse-item{padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;}
.verse-item:last-child{border-bottom:none;}
.verse-item:hover{background:rgba(201,169,110,.08);}
.verse-ref{font-size:11px;font-weight:700;color:var(--gold);margin-bottom:4px;}
.verse-text{font-family:'Noto Serif KR',serif;font-size:14px;line-height:1.7;color:var(--text);}

/* 구절 상세 팝업 */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:flex-end;justify-content:center;}
.overlay.show{display:flex;}
.popup{background:var(--bg2);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:600px;}
.popup-ref{font-size:12px;color:var(--gold);font-weight:700;margin-bottom:12px;}
.popup-text{font-family:'Noto Serif KR',serif;font-size:17px;line-height:1.9;color:var(--text);margin-bottom:20px;}
.popup-btns{display:flex;gap:8px;}
.pbtn{flex:1;padding:12px;border-radius:10px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;border:none;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;}
.pbtn-primary{background:linear-gradient(135deg,#d97706,#f59e0b);color:#fff;}
.pbtn-sec{background:var(--bg3);color:var(--text);border:1px solid var(--border);}
.pbtn-close{background:transparent;color:var(--text2);font-size:22px;flex:0;padding:0 8px;}
</style>
</head>
<body>

<header>
  <div class="logo">✝ 성경</div>
  <a href="index.html" class="back-btn">← 앱으로</a>
</header>

<div class="main">

  <div class="section-title">📖 성경 열람</div>

  <a class="bible-link" href="https://holybible.biblenote.kr/read.html" target="_blank">
    <span class="icon">📖</span>
    <div class="info">
      <b>홀리바이블 성경 읽기</b>
      <span>개역한글 · 개역개정 · NIV · KJV 등 17개 번역본<br>성경 검색 · 성경사전 · 원어 분석 지원</span>
    </div>
    <span class="arrow">›</span>
  </a>

  <a class="bible-link" href="https://holybible.biblenote.kr/search.html" target="_blank">
    <span class="icon">🔍</span>
    <div class="info">
      <b>성경 구절 검색</b>
      <span>키워드로 구절 찾기<br>예) 사랑, 믿음, 소망</span>
    </div>
    <span class="arrow">›</span>
  </a>

  <div class="section-title" style="display:flex;align-items:center;justify-content:space-between;">
    <span>✨ 오늘의 말씀</span>
    <button onclick="shuffleVerses()" style="padding:5px 12px;background:rgba(201,169,110,.15);border:1px solid var(--border);border-radius:99px;color:var(--gold);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;">🔄 새로고침</button>
  </div>

  <div class="verse-box" id="verseBox"></div>

</div>

<!-- 구절 상세 팝업 -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeVerse()">
  <div class="popup">
    <div class="popup-ref" id="popRef"></div>
    <div class="popup-text" id="popText"></div>
    <div class="popup-btns">
      <button class="pbtn pbtn-primary" onclick="sendToCard()">✨ 말씀카드</button>
      <button class="pbtn pbtn-sec" onclick="copyVerse()">📋 복사</button>
      <button class="pbtn pbtn-close" onclick="closeVerse()">✕</button>
    </div>
  </div>
</div>

<script>
// 전체 성경 구절 데이터베이스 (개역한글)
const ALL_VERSES = [
  {ref:"창세기 1:1",text:"태초에 하나님이 천지를 창조하시니라"},
  {ref:"창세기 1:27",text:"하나님이 자기 형상 곧 하나님의 형상대로 사람을 창조하시되 남자와 여자를 창조하시고"},
  {ref:"창세기 50:20",text:"당신들은 나를 해하려 하였으나 하나님은 그것을 선으로 바꾸사 오늘과 같이 많은 백성의 생명을 구원하게 하시려 하셨나니"},
  {ref:"출애굽기 14:14",text:"여호와께서 너희를 위하여 싸우시리니 너희는 가만히 있을지니라"},
  {ref:"신명기 31:6",text:"마음을 강하게 하고 담대히 하라 그들을 두려워 말라 그들 앞에서 떨지 말라 이는 네 하나님 여호와 그가 너와 함께 행하실 것임이라 반드시 너를 떠나지 아니하시며 버리지 아니하시리라"},
  {ref:"여호수아 1:9",text:"내가 네게 명한 것이 아니냐 마음을 강하게 하고 담대히 하라 두려워 말며 놀라지 말라 네가 어디로 가든지 네 하나님 여호와가 너와 함께하느니라"},
  {ref:"시편 1:1",text:"복 있는 사람은 악인의 꾀를 좇지 아니하며 죄인의 길에 서지 아니하며 오만한 자의 자리에 앉지 아니하고"},
  {ref:"시편 1:2",text:"오직 여호와의 율법을 즐거워하여 그 율법을 주야로 묵상하는 자로다"},
  {ref:"시편 1:3",text:"저는 시냇가에 심은 나무가 시절을 좇아 과실을 맺으며 그 잎사귀가 마르지 아니함 같으니 그 행사가 다 형통하리로다"},
  {ref:"시편 19:1",text:"하늘이 하나님의 영광을 선포하고 궁창이 그 손으로 하신 일을 나타내는도다"},
  {ref:"시편 19:14",text:"나의 반석이시요 나의 구속자이신 여호와여 내 입의 말과 마음의 묵상이 주의 앞에 열납되기를 원하나이다"},
  {ref:"시편 23:1",text:"여호와는 나의 목자시니 내가 부족함이 없으리로다"},
  {ref:"시편 23:4",text:"내가 사망의 음침한 골짜기로 다닐지라도 해를 두려워하지 않을 것은 주께서 나와 함께하심이라 주의 지팡이와 막대기가 나를 안위하시나이다"},
  {ref:"시편 23:6",text:"나의 평생에 선하심과 인자하심이 정녕 나를 따르리니 내가 여호와의 집에 영원히 거하리로다"},
  {ref:"시편 27:1",text:"여호와는 나의 빛이요 나의 구원이시니 내가 누구를 두려워하리요 여호와는 내 생명의 능력이시니 내가 누구를 무서워하리요"},
  {ref:"시편 34:8",text:"너희는 여호와의 선하심을 맛보아 알지어다 그에게 피하는 자는 복이 있도다"},
  {ref:"시편 37:4",text:"또 여호와를 기뻐하라 저가 네 마음의 소원을 이루어 주시리로다"},
  {ref:"시편 46:1",text:"하나님은 우리의 피난처시요 힘이시니 환난 중에 만날 큰 도움이시라"},
  {ref:"시편 91:1",text:"지존자의 은밀한 곳에 거하는 자는 전능자의 그늘 아래 거하리로다"},
  {ref:"시편 91:2",text:"나는 여호와를 가리켜 말하기를 그는 나의 피난처요 나의 요새요 나의 의뢰하는 하나님이라 하리니"},
  {ref:"시편 100:4",text:"감사함으로 그 문에 들어가며 찬송함으로 그 궁정에 들어가서 그에게 감사하며 그 이름을 송축할지어다"},
  {ref:"시편 103:2",text:"내 영혼아 여호와를 송축하며 그 모든 은택을 잊지 말지어다"},
  {ref:"시편 103:13",text:"아비가 자식을 불쌍히 여김같이 여호와께서는 자기를 경외하는 자를 불쌍히 여기시나니"},
  {ref:"시편 119:105",text:"주의 말씀은 내 발에 등이요 내 길에 빛이니이다"},
  {ref:"시편 121:1",text:"내가 산을 향하여 눈을 들리라 나의 도움이 어디서 올꼬"},
  {ref:"시편 121:2",text:"나의 도움이 천지를 지으신 여호와에게서로다"},
  {ref:"시편 121:8",text:"여호와께서 너의 출입을 지금부터 영원까지 지키시리로다"},
  {ref:"잠언 3:5",text:"너는 마음을 다하여 여호와를 의뢰하고 네 명철을 의지하지 말라"},
  {ref:"잠언 3:6",text:"너는 범사에 그를 인정하라 그리하면 네 길을 지도하시리라"},
  {ref:"잠언 16:3",text:"너의 행사를 여호와께 맡기라 그리하면 네가 경영하는 것이 이루리라"},
  {ref:"잠언 17:17",text:"친구는 사랑이 끊이지 아니하고 형제는 위급한 때를 위하여 났느니라"},
  {ref:"잠언 22:6",text:"마땅히 행할 길을 아이에게 가르치라 그리하면 늙어도 그것을 떠나지 아니하리라"},
  {ref:"이사야 40:28",text:"너는 알지 못하였느냐 듣지 못하였느냐 영원하신 하나님 여호와 땅 끝까지 창조하신 자는 피곤치 아니하시며 곤비치 아니하시며 명철이 한이 없으시며"},
  {ref:"이사야 40:31",text:"오직 여호와를 앙망하는 자는 새 힘을 얻으리니 독수리의 날개치며 올라감 같을 것이요 달음박질하여도 곤비치 아니하겠고 걸어가도 피곤치 아니하리로다"},
  {ref:"이사야 41:10",text:"두려워 말라 내가 너와 함께 함이니라 놀라지 말라 나는 네 하나님이 됨이니라 내가 너를 굳세게 하리라 참으로 너를 도와 주리라 참으로 나의 의로운 오른손으로 너를 붙들리라"},
  {ref:"이사야 43:2",text:"네가 물 가운데로 지날 때에 내가 너와 함께할 것이라 강을 건널 때에 물이 너를 침몰치 못할 것이며 네가 불 가운데로 행할 때에 타지도 아니할 것이요 불꽃이 너를 사르지도 못하리니"},
  {ref:"예레미야 29:11",text:"나 여호와가 말하노라 너희를 향한 나의 생각은 내가 아나니 재앙이 아니라 곧 평안이요 너희 장래에 소망을 주려 하는 생각이라"},
  {ref:"예레미야 33:3",text:"너는 내게 부르짖으라 내가 네게 응답하겠고 네가 알지 못하는 크고 비밀한 일을 네게 보이리라"},
  {ref:"마태복음 5:3",text:"심령이 가난한 자는 복이 있나니 천국이 저희 것임이요"},
  {ref:"마태복음 5:9",text:"화평케 하는 자는 복이 있나니 저희가 하나님의 아들이라 일컬음을 받을 것임이요"},
  {ref:"마태복음 6:33",text:"너희는 먼저 그의 나라와 그의 의를 구하라 그리하면 이 모든 것을 너희에게 더하시리라"},
  {ref:"마태복음 7:7",text:"구하라 그러면 너희에게 주실 것이요 찾으라 그러면 찾을 것이요 문을 두드리라 그러면 너희에게 열릴 것이니"},
  {ref:"마태복음 11:28",text:"수고하고 무거운 짐 진 자들아 다 내게로 오라 내가 너희를 쉬게 하리라"},
  {ref:"마태복음 11:29",text:"나는 마음이 온유하고 겸손하니 나의 멍에를 메고 내게 배우라 그러면 너희 마음이 쉼을 얻으리니"},
  {ref:"마태복음 28:20",text:"내가 너희에게 분부한 모든 것을 가르쳐 지키게 하라 볼지어다 내가 세상 끝날까지 너희와 항상 함께 있으리라"},
  {ref:"요한복음 3:16",text:"하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 저를 믿는 자마다 멸망치 않고 영생을 얻게 하려 하심이니라"},
  {ref:"요한복음 8:32",text:"진리를 알지니 진리가 너희를 자유케 하리라"},
  {ref:"요한복음 10:10",text:"도적이 오는 것은 도적질하고 죽이고 멸망시키려는 것뿐이요 내가 온 것은 양으로 생명을 얻게 하고 더 풍성히 얻게 하려는 것이라"},
  {ref:"요한복음 13:34",text:"새 계명을 너희에게 주노니 서로 사랑하라 내가 너희를 사랑한 것같이 너희도 서로 사랑하라"},
  {ref:"요한복음 14:1",text:"너희는 마음에 근심하지 말라 하나님을 믿으니 또 나를 믿으라"},
  {ref:"요한복음 14:6",text:"예수께서 가라사대 내가 곧 길이요 진리요 생명이니 나로 말미암지 않고는 아버지께로 올 자가 없느니라"},
  {ref:"요한복음 14:27",text:"평안을 너희에게 끼치노니 곧 나의 평안을 너희에게 주노라 내가 너희에게 주는 것은 세상이 주는 것 같지 아니하니라 너희는 마음에 근심도 말고 두려워하지도 말라"},
  {ref:"요한복음 15:5",text:"나는 포도나무요 너희는 가지니 저가 내 안에 내가 저 안에 있으면 이 사람은 과실을 많이 맺나니 나를 떠나서는 너희가 아무것도 할 수 없음이라"},
  {ref:"로마서 5:8",text:"우리가 아직 죄인 되었을 때에 그리스도께서 우리를 위하여 죽으심으로 하나님께서 우리에게 대한 자기의 사랑을 확증하셨느니라"},
  {ref:"로마서 8:28",text:"우리가 알거니와 하나님을 사랑하는 자 곧 그 뜻대로 부르심을 입은 자들에게는 모든 것이 합력하여 선을 이루느니라"},
  {ref:"로마서 8:38-39",text:"내가 확신하노니 사망이나 생명이나 천사들이나 권세자들이나 현재 일이나 장래 일이나 능력이나 높음이나 깊음이나 다른 아무 피조물이라도 우리를 우리 주 그리스도 예수 안에 있는 하나님의 사랑에서 끊을 수 없으리라"},
  {ref:"고린도전서 13:4",text:"사랑은 오래 참고 사랑은 온유하며 시기하지 아니하며 사랑은 자랑하지 아니하며 교만하지 아니하며"},
  {ref:"고린도전서 13:13",text:"그런즉 믿음 소망 사랑 이 세 가지는 항상 있을 것인데 그 중에 제일은 사랑이라"},
  {ref:"갈라디아서 2:20",text:"내가 그리스도와 함께 십자가에 못 박혔나니 그런즉 이제는 내가 산 것이 아니요 오직 내 안에 그리스도께서 사신 것이라"},
  {ref:"에베소서 2:8",text:"너희가 그 은혜를 인하여 믿음으로 말미암아 구원을 얻었나니 이것이 너희에게서 난 것이 아니요 하나님의 선물이라"},
  {ref:"에베소서 6:10",text:"종말로 너희가 주 안에서와 그 힘의 능력으로 강건하여지고"},
  {ref:"빌립보서 4:6",text:"아무것도 염려하지 말고 오직 모든 일에 기도와 간구로 너희 구할 것을 감사함으로 하나님께 아뢰라"},
  {ref:"빌립보서 4:7",text:"그리하면 모든 지각에 뛰어난 하나님의 평강이 그리스도 예수 안에서 너희 마음과 생각을 지키시리라"},
  {ref:"빌립보서 4:13",text:"내게 능력 주시는 자 안에서 내가 모든 것을 할 수 있느니라"},
  {ref:"데살로니가전서 5:16-18",text:"항상 기뻐하라 쉬지 말고 기도하라 범사에 감사하라 이는 그리스도 예수 안에서 너희를 향하신 하나님의 뜻이니라"},
  {ref:"히브리서 11:1",text:"믿음은 바라는 것들의 실상이요 보지 못하는 것들의 증거니"},
  {ref:"히브리서 12:1",text:"우리에게 구름같이 둘러싼 허다한 증인들이 있으니 모든 무거운 것과 얽매이기 쉬운 죄를 벗어 버리고 인내로써 우리 앞에 당한 경주를 경주하며"},
  {ref:"야고보서 1:5",text:"너희 중에 누구든지 지혜가 부족하거든 모든 사람에게 후히 주시고 꾸짖지 아니하시는 하나님께 구하라 그리하면 주시리라"},
  {ref:"베드로전서 5:7",text:"너희 염려를 다 주께 맡겨 버리라 이는 저가 너희를 권고하심이니라"},
  {ref:"요한일서 4:8",text:"사랑하지 아니하는 자는 하나님을 알지 못하나니 이는 하나님은 사랑이심이라"},
  {ref:"요한일서 4:19",text:"우리가 사랑함은 그가 먼저 우리를 사랑하셨음이라"},
  {ref:"요한계시록 21:4",text:"모든 눈물을 그 눈에서 씻기시매 다시 사망이 없고 애통하는 것이나 곡하는 것이나 아픈 것이 다시 있지 아니하리니 처음 것들이 다 지나갔음이러라"},
];

let _ref='', _text='';

function shuffleVerses(){
  const shuffled = [...ALL_VERSES].sort(()=>Math.random()-.5).slice(0,8);
  const box = document.getElementById('verseBox');
  box.innerHTML = shuffled.map(v=>`
    <div class="verse-item" onclick="showVerse('${v.ref}','${v.text.replace(/'/g,"\'")}')">
      <div class="verse-ref">${v.ref}</div>
      <div class="verse-text">${v.text.length>50?v.text.substring(0,50)+'...':v.text}</div>
    </div>`).join('');
}

// 페이지 로드 시 랜덤 구절 표시
shuffleVerses();

function showVerse(ref, text){
  _ref=ref; _text=text;
  document.getElementById('popRef').textContent='📖 '+ref+' (개역한글)';
  document.getElementById('popText').textContent=text;
  document.getElementById('overlay').classList.add('show');
}
function closeVerse(){ document.getElementById('overlay').classList.remove('show'); }
function copyVerse(){
  navigator.clipboard.writeText('"'+_text+'" - '+_ref+' (개역한글)').then(()=>{
    showToast('📋 복사되었습니다!'); closeVerse();
  });
}
function sendToCard(){
  sessionStorage.setItem('verseCard',JSON.stringify({ref:_ref,text:_text}));
  window.location.href='index.html#versecard';
}
function showToast(msg){
  const el=document.createElement('div');
  el.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a2535;color:#e8c98a;border:1px solid rgba(201,169,110,.3);padding:10px 20px;border-radius:99px;font-size:13px;z-index:9999;font-family:inherit;';
  el.textContent=msg; document.body.appendChild(el);
  setTimeout(()=>el.remove(),2500);
}
</script>
